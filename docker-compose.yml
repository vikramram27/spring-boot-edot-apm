services:
  postgres:
    image: postgres:16-alpine
    container_name: edot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edot_apm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edot_apm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - edot-network

  redis:
    image: redis:7-alpine
    container_name: edot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - edot-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edot-spring-boot-app
    restart: unless-stopped
    ports:
      - "8088:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - edot-network

volumes:
  postgres_data:
  redis_data:

networks:
  edot-network:
    driver: bridge
